aid: eleqtron
name: Eleqtron
description: >-
  eleQtron GmbH is a German quantum computing hardware company founded in 2020 as
  a spin-off from the Quantum Optics Department at the University of Siegen by
  Prof. Dr. Christof Wunderlich, Dr. Michael Johanning (CTO), and Jan Leisse (CEO).
  Based in Siegen, Germany, eleQtron develops freely programmable, scalable
  trapped-ion quantum computers built on its proprietary MAGIC (Magnetic Gradient
  Induced Coupling) technology, which controls qubits with microwaves rather than
  lasers for higher precision and a clearer path to scaling. The company aims to
  become a leading provider of quantum computing time for industrial applications
  across chemicals, pharmaceuticals, automotive, logistics, finance, and machine
  learning. eleQtron's systems are made accessible to developers through cloud
  platforms and standard quantum frameworks (Qiskit, Cirq, PennyLane) rather than
  a first-party public REST API. Backed by Earlybird Venture Capital.
